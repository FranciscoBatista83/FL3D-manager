{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FL3D Manager</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #F3F0F8;
        }
        .login-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="text-center mb-4">
                    <img src="{% static 'img/logo.jpg' %}" alt="FL3D Studio Logo" class="rounded-circle mb-3 shadow-sm" style="width: 80px; height: 80px; object-fit: cover;">
                    <h2 class="fw-bold" style="color: #2D1B69;">FL3D Manager</h2>
                    <p class="text-muted">Acesso ao Sistema</p>
                </div>

                <div class="card login-card">
                    <div class="card-body p-4">
                        {% if form.errors %}
                        <div class="alert alert-danger py-2 px-3 small">
                            Usuário ou senha incorretos. Tente novamente.
                        </div>
                        {% endif %}

                        <form method="post" action="{% url 'login' %}">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="id_username" class="form-label fw-bold">Usuário</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="id_password" class="form-label fw-bold">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" class="form-control" id="id_password" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="bi bi-eye" id="toggleIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                            </div>
                            <input type="hidden" name="next" value="{{ next }}">
                        </form>
                        <script>
                            document.getElementById('togglePassword').addEventListener('click', function (e) {
                                const passwordInput = document.getElementById('id_password');
                                const toggleIcon = document.getElementById('toggleIcon');
                                if (passwordInput.type === 'password') {
                                    passwordInput.type = 'text';
                                    toggleIcon.classList.remove('bi-eye');
                                    toggleIcon.classList.add('bi-eye-slash');
                                } else {
                                    passwordInput.type = 'password';
                                    toggleIcon.classList.remove('bi-eye-slash');
                                    toggleIcon.classList.add('bi-eye');
                                }
                            });
                        </script>
                    </div>
                </div>
                <div class="text-center mt-4 text-muted small">
                    &copy; 2026 FL3D Studio. Todos os direitos reservados.
                </div>
            </div>
        </div>
    </div>

</body>
</html>
